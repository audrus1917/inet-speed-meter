[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "internet-speed-meter"
version = "0.1.0"
description = "Консольный замер скорости загрузки по HTTP"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Andrey Kozhevnikov" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
internet-speed-meter = "speed_meter.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
